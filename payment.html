<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Verification | APL Admin</title>

<link rel="stylesheet" href="admin.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

h2{
    text-align:center;
    color:#0b5ed7;
}

#paymentList{
    display:grid;
    gap:20px;
    margin-top:20px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    max-width:300px;
    border-radius:8px;
    margin-top:10px;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
    color:#fff;
}

.approve{
    background:green;
}

.reject{
    background:red;
}
</style>

</head>

<body>

<h2>💳 Payment Verification</h2>

<div id="paymentList">
Loading Payments...
</div>

<script type="module" src="payment.js"></script>

</body>
</html>
