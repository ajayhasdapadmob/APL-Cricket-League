<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APL Admin Login</title>

<link rel="stylesheet" href="admin.css">

<style>

body{
background:#0d1117;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
width:350px;
background:#161b22;
padding:30px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,255,0,.2);
}

.login-box h2{
text-align:center;
color:#00ff00;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#00c853;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#009624;
}

p{
text-align:center;
color:white;
margin-top:15px;
}

</style>

</head>

<body>

<div class="login-box">

<h2>🏏 APL Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
🔐 Login
</button>

<p id="msg"></p>

</div>

<script type="module" src="admin-login.js"></script>

</body>
</html>
