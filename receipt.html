<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APL 2026 Registration Receipt</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    text-align:center;
    margin:0;
}
.container{
    max-width:700px;
    margin:20px auto;
    background:#222;
    padding:20px;
    border-radius:10px;
}
input{
    width:90%;
    padding:10px;
    margin:10px;
    font-size:16px;
}
button{
    padding:12px 20px;
    margin:5px;
    font-size:16px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
#result{
    margin-top:20px;
}
</style>

</head>
<body>

<div class="container">

<h2>🏆 APL 2026 Registration Receipt</h2>

<input
type="text"
id="regId"
placeholder="Enter Registration ID">

<br>

<button onclick="checkRegistration()">
🔍 Check Registration
</button>

<div id="result"></div>

</div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Receipt JS -->
<script type="module" src="check.js"></script>

</body>
</html>
